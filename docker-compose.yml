services:
  postgres:
    image: postgres:16
    container_name: ecommerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce_ai_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_ai_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ecommerce_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  api:
    image: python:3.11-slim
    container_name: ecommerce_api
    working_dir: /app
    command: >
      sh -c "pip install --upgrade pip &&
             pip install -e . &&
             uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  streamlit:
    image: python:3.11-slim
    container_name: ecommerce_streamlit
    working_dir: /app
    command: >
      sh -c "pip install --upgrade pip &&
             pip install -e . &&
             streamlit run src/ui/app.py --server.address 0.0.0.0 --server.port 8501"
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data:
  ollama_data: